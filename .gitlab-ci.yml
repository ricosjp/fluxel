variables:
  PYTHON_VERSION: "3.12"
  BASE_LAYER: bookworm-slim
  # GitLab CI creates a separate mountpoint for the build directory,
  # so we need to copy instead of using hard links.
  UV_LINK_MODE: copy

stages:
  - test
  - build
  - deploy

default:
  image: astral/uv:python${PYTHON_VERSION}-${BASE_LAYER}
  before_script:
    - apt-get update -qq && apt-get install -y -qq build-essential curl
    - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
    - source ~/.cargo/env
    - cargo install cargo-llvm-cov --locked

lint:
  stage: test
  script:
    - uv sync --group lint
    - make lint
  tags:
    - no-gpu

pytest:
  stage: test
  script:
    - uv tool install maturin
    - uv sync --group test
    - cargo llvm-cov show-env --sh > .llvm-cov-env
    - . ./.llvm-cov-env
    - cargo llvm-cov clean --workspace
    - cargo test
    - uv run maturin develop
    - uv run pytest tests --cov=src --cov-report xml
    - cargo llvm-cov report --cobertura --output-path coverage.xml
    - cargo llvm-cov report --html --output-dir htmlcov
  coverage: '/TOTAL.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - htmlcov/
      - coverage.xml
  tags:
    - no-gpu
    - GenuineIntel



# -----------------------------------------------------------------------------
# build / deploy
# -----------------------------------------------------------------------------
# Publish is tag-only. The tag (with an optional leading "v") must match
# version in both pyproject.toml and Cargo.toml.
#
# GitLab CI/CD variables (masked, protected; use protected tags):
#   PYPI_PUBLISH_TOKEN  PyPI API token (pypi-...)
#

.build:wheel:
  stage: build
  image:
    name: ghcr.io/pyo3/maturin:latest
    entrypoint: [""]
  before_script: []
  script:
    - |
      set -eu
      TAG="${CI_COMMIT_TAG#v}"
      PY_VERSION=$(awk -F'"' '/^version = / {print $2; exit}' pyproject.toml)
      CARGO_VERSION=$(awk -F'"' '/^version = / {print $2; exit}' Cargo.toml)
      echo "tag=${TAG} pyproject=${PY_VERSION} cargo=${CARGO_VERSION}"
      test "${PY_VERSION}" = "${TAG}"
      test "${CARGO_VERSION}" = "${TAG}"
    - maturin build --release --strip --sdist --compatibility pypi --out dist
  artifacts:
    paths:
      - dist/
    expire_in: 7 days
  rules:
    - if: $CI_COMMIT_TAG

build:wheel:linux:
  extends: .build:wheel
  tags:
    - no-gpu
    - GenuineIntel

publish:pypi:
  stage: deploy
  image: astral/uv:python${PYTHON_VERSION}-${BASE_LAYER}
  before_script: []
  needs:
    - job: build:wheel:linux
  script:
    - uv publish --token "$PYPI_PUBLISH_TOKEN"
  environment:
    name: pypi
    url: https://pypi.org/project/fluxel-cfd/
  resource_group: pypi
  tags:
    - no-gpu
  rules:
    - if: $CI_COMMIT_TAG
      when: manual

