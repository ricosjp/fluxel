# APIBM mesh export configuration for export_apibm.py
#
# Paths are relative to the current working directory unless absolute.

input_mesh: "data/stl/DrivAer.stl"
output_vtu: "examples/output/apibm/apibm_DrivAer.vtu"

target_level: 3
n_leaf_refinement: 3
# Optional cell-count limit; exceeding it fails instead of reducing refinement.
max_cells: null  # e.g. 1000000; null means no user-specified limit
base_resolution: [8, 4, 2]

bounding_box:
  min: [-5.0, -4.0, 0.0]
  max: [11.0, 4.0, 4.0]

fluid_seed_point: [-4.0, 0.0, 2.0]
