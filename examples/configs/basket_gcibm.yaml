# GCIBM mesh export configuration for export_gcibm.py
#
# Paths are relative to the current working directory unless absolute.

input_mesh: "data/obj/basket.obj"
output_vtu: "examples/output/gcibm/gcibm_basket.vtu"

target_level: 3
n_leaf_refinement: 3
# Optional cell-count limit; exceeding it fails instead of reducing refinement.
max_cells: null  # e.g. 1000000; null means no user-specified limit
base_resolution: [3, 3, 3]

bounding_box:
  min: [-3.0, -3.0, -3.0]
  max: [3.0, 3.0, 3.0]

fluid_seed_point: [-2.0, 0.0, 0.0]
