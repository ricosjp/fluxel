# APIBM mesh export configuration for export_apibm.py
#
# Paths are relative to the current working directory unless absolute.

input_mesh: "data/obj/motorBike_drop_shadow.obj"
output_vtu: "examples/output/apibm/apibm_motorBike.vtu"

target_level: 4
n_leaf_refinement: 3
base_resolution: [10, 4, 4]

bounding_box:
  min: [-5.0, -4.0, 0.0]
  max: [15.0, 4.0, 8.0]

refinement_regions:
  - name: wake
    min: [-1.0, -0.7, 0.0]
    max: [8.0, 0.7, 2.5]
    level: 3

fluid_seed_point: [-4.0, 0.0, 2.0]
