# APIBM mesh export configuration for export_apibm.py
#
# Paths are relative to the current working directory unless absolute.

input_stl: "data/obj/basket.obj"
output_vtu: "examples/output/apibm/apibm_basket.vtu"

target_level: 3
n_leaf_refinement: 3
base_resolution: [3, 3, 3]

bounding_box:
  min: [-3.0, -3.0, -3.0]
  max: [3.0, 3.0, 3.0]

fluid_seed_point: [-2.0, 0.0, 0.0]
